plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'

dependencies {
	compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.12'
	testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
}

group = 'com.osrssync'
version = '1.0.0'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}


tasks.register('run', JavaExec) {
	description = 'Launches RuneLite in developer mode with this plugin loaded'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.osrssync.AccountSyncPluginTest'
	args '--developer-mode'
	jvmArgs '-ea'
	// macOS: RuneLite's fullscreen support subclasses an Apple-internal AWT class
	jvmArgs '--add-exports=java.desktop/com.apple.eawt=ALL-UNNAMED', '--add-opens=java.desktop/com.apple.eawt=ALL-UNNAMED'
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes('Main-Class': 'com.osrssync.AccountSyncPluginTest', 'Multi-Release': true)
	}
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.test.output
	from {
		configurations.testRuntimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}
	exclude 'META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', '**/module-info.class'
	group = "build"
	archiveClassifier.set('shaded')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}

tasks.register('chatSmoke', JavaExec) {
	description = 'Sends two chat messages to a running local server'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.osrssync.ChatClientSmoke'
}

tasks.register('panelPreview', JavaExec) {
	description = 'Renders the sidebar to PNGs in build/preview'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.osrssync.PanelPreview'
	jvmArgs '--add-exports=java.desktop/com.apple.eawt=ALL-UNNAMED', '-Dapple.awt.UIElement=true'
	// e.g. ./gradlew panelPreview -Ppreview.height=740
	['preview.width', 'preview.height', 'preview.scale'].each { key ->
		if (project.hasProperty(key)) systemProperty key, project.property(key)
	}
}

tasks.register('panelPerf', JavaExec) {
	description = 'Times sidebar page switches, Home rebuilds, long chats and streaming, offscreen'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.osrssync.PanelPerf'
	jvmArgs '--add-exports=java.desktop/com.apple.eawt=ALL-UNNAMED', '-Dapple.awt.UIElement=true'
	// ./gradlew panelPerf -Pperf.sample prints where the Swing thread spends a streaming update
	if (project.hasProperty('perf.sample')) systemProperty 'perf.sample', 'true'
}

tasks.register('chatHistoryCheck', JavaExec) {
	description = 'End-to-end chat history and concurrency check against the local server (npm run dev)'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.osrssync.ChatHistoryCheck'
	workingDir = projectDir
	jvmArgs '--add-exports=java.desktop/com.apple.eawt=ALL-UNNAMED', '-Dapple.awt.UIElement=true'
}

tasks.register('scenariosCheck', JavaExec) {
	description = 'Prints the live chat starters for a few sample situations'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.osrssync.ScenariosCheck'
}

tasks.register('inGameCheck', JavaExec) {
	description = 'Checks in-game chat formatting and a chatbox question against the local server'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.osrssync.InGameCheck'
	workingDir = projectDir
	jvmArgs '-Dapple.awt.UIElement=true'
}

tasks.register('transitionCheck', JavaExec) {
	description = 'Captures frames of the floating composer settling into the chat (build/preview/10-transition-strip.png)'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.osrssync.TransitionCheck'
	workingDir = projectDir
	jvmArgs '--add-exports=java.desktop/com.apple.eawt=ALL-UNNAMED', '-Dapple.awt.UIElement=true'
}

tasks.register('portraitTune', JavaExec) {
	description = 'Renders a saved player model (portrait-model.json) at several framings, into build/preview'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.osrssync.PortraitTune'
	jvmArgs '-Dapple.awt.UIElement=true'
	// e.g. ./gradlew portraitTune -PportraitModel=~/.runelite/account-sync/Name/portrait-model.json
	if (project.hasProperty('portraitModel')) args([project.property('portraitModel')] + (project.hasProperty('portraitOut') ? [project.property('portraitOut')] : []))
}
